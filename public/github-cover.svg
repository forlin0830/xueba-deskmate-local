    <text x="789" y="128" fill="#91acc6" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="11">考纲范围 · 分层难度 · 不会作答</text>

    <path d="M769 141v22" stroke="url(#accent)" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="3 4"/>
    <rect x="743" y="161" width="352" height="54" rx="13" fill="#1b3552"/>
    <circle cx="769" cy="188" r="11" fill="#749dff" fill-opacity="0.18" stroke="#8ab3ff"/>
    <path d="m765 188 3 3 6-7" fill="none" stroke="#b6ccff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="789" y="185" fill="#e8f4ff" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="14" font-weight="700">02  弄懂每一道错题</text>
    <text x="789" y="203" fill="#91acc6" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="11">追问解释 · 专题强化 · 题目依据</text>

    <path d="M769 216v22" stroke="url(#accent)" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="3 4"/>
    <rect x="743" y="236" width="352" height="54" rx="13" fill="#1b3552"/>
    <circle cx="769" cy="263" r="11" fill="#a48dff" fill-opacity="0.18" stroke="#b4a0ff"/>
    <path d="m765 263 3 3 6-7" fill="none" stroke="#d3c8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="789" y="260" fill="#e8f4ff" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="14" font-weight="700">03  在下一轮诊断中复测</text>
    <text x="789" y="278" fill="#91acc6" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="11">持续回看 · 掌握进度 · 学习档案</text>

    <rect x="743" y="310" width="119" height="25" rx="12.5" fill="#22483f"/>
    <text x="759" y="327" fill="#9be9d7" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1">LOCAL-FIRST</text>
    <rect x="872" y="310" width="105" height="25" rx="12.5" fill="#263c61"/>
    <text x="888" y="327" fill="#b7d0ff" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1">YOUR KEYS</text>
  </g>

  <text x="73" y="374" fill="#7292ae" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="1.4">DIAGNOSE WHAT YOU DON'T KNOW.  LEARN IT UNTIL YOU DO.</text>
</svg>
