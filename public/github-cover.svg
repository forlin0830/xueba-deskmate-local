<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">你的学霸同桌</title>
  <desc id="desc">从诊断到突破的本地优先 AI 学习工作台</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101e"/>
      <stop offset="0.54" stop-color="#0d1d34"/>
      <stop offset="1" stop-color="#111d3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78e6df"/>
      <stop offset="0.5" stop-color="#6fa9ff"/>
      <stop offset="1" stop-color="#ae91ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#566cf4" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#566cf4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#6884aa" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020612" flood-opacity="0.48"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#background)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="957" cy="189" r="290" fill="url(#glow)"/>
  <path d="M0 344 C270 260 412 431 678 349 C905 279 1020 324 1200 206" fill="none" stroke="url(#accent)" stroke-opacity="0.13" stroke-width="2"/>

  <g transform="translate(72 57)">
    <rect width="44" height="44" rx="13" fill="#132d46" stroke="#81dce2" stroke-opacity="0.53"/>
    <path d="M11 14c5-3 8-2 11 0v18c-3-2-6-3-11 0V14Zm22 0c-5-3-8-2-11 0v18c3-2 6-3 11 0V14Z" fill="none" stroke="#a5f3ee" stroke-width="2.1" stroke-linejoin="round"/>
    <path d="M22 14v18" stroke="#a5f3ee" stroke-width="2.1"/>
    <text x="58" y="17" fill="#88a7c7" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="3.2">XUEBA DESKMATE</text>
    <text x="58" y="37" fill="#dceafa" font-family="Inter,Arial,sans-serif" font-size="12" letter-spacing="1.3">OPEN SOURCE · LOCAL EDITION</text>
  </g>

  <text x="72" y="181" fill="#f5f9ff" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="62" font-weight="750" letter-spacing="2">你的学霸同桌</text>
  <text x="74" y="233" fill="#b9cfe4" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="24">先发现薄弱点，再把它真正学会。</text>
  <rect x="73" y="271" width="354" height="43" rx="21.5" fill="#132d45" stroke="#4c7895" stroke-opacity="0.75"/>
  <text x="95" y="298" fill="#b9e5ec" font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="15" font-weight="600">全面诊断  →  逐题强化  →  多轮复测</text>

